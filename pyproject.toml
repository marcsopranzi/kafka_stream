[project]
name = "kafka-stream"
version = "0.1.0"
description = "Production-grade PySpark/Kafka ingestion pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.4",
    # kafka-python-ng is the actively maintained community fork of the
    # abandoned kafka-python 2.0.2. Drop-in API compatible — no code changes required.
    "kafka-python-ng>=2.2.3",
    "pre-commit>=3.8.0",
    # API service
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Producer HTTP client — supports sync + async, HTTP/2, fine-grained timeouts.
    "httpx>=0.27.0",
    # Retry / backoff logic for the producer poll loop.
    "tenacity>=8.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    # mock and magicmock removed: unittest.mock.MagicMock is stdlib in Python 3.3+
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
py_version = 310

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
