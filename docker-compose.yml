services:

  # --------------------------------------------------------------------------
  # Kafka infrastructure
  # --------------------------------------------------------------------------

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      # zookeeper-shell is bundled in the Confluent image and uses the client
      # protocol — no 4-letter commands needed.
      test: ["CMD-SHELL", "zookeeper-shell localhost:2181 ls / > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s

  broker:
    image: confluentinc/cp-kafka:7.6.1
    hostname: broker
    container_name: broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # 9092 is exposed to the host for manual inspection (kafka-console-consumer, etc.)
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      # Two listeners:
      #   PLAINTEXT      — internal Docker network  (broker:29092)
      #   PLAINTEXT_HOST — host machine             (localhost:9092)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 45s

  # One-shot container: creates the topic then exits.
  # Runs after the broker is healthy so the producer never hits a missing topic.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        kafka-topics --create \
          --if-not-exists \
          --bootstrap-server broker:29092 \
          --replication-factor 1 \
          --partitions 3 \
          --topic log-topic
        echo "Topic log-topic ready."

  # --------------------------------------------------------------------------
  # Cassandra
  # --------------------------------------------------------------------------

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: citizix
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  # --------------------------------------------------------------------------
  # Application services
  # --------------------------------------------------------------------------

  api:
    build: .
    container_name: api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      # Controlled via make api-up MODE=<quiet|normal|burst|flood>
      API_DEFAULT_MODE: ${API_DEFAULT_MODE:-normal}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  producer:
    build: .
    container_name: producer
    command: python producer/main.py
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      KAFKA_TOPIC_NAME: log-topic
      STREAM_MODE: normal
      STREAM_READ_TIMEOUT_SECONDS: "30"
      CB_FAILURE_THRESHOLD: "5"
      CB_RECOVERY_TIMEOUT_SECONDS: "30"
      # In production, inject this from a secrets manager (AWS Secrets Manager,
      # HashiCorp Vault, etc.). Never hardcode.
      PII_HASH_KEY: ${PII_HASH_KEY:-local-dev-key-change-before-production}
    restart: on-failure

volumes:
  cassandra_data:
